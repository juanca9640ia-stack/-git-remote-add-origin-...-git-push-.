databases:
  - name: erp-db
    plan: free
    databaseName: erp
    user: erp

services:
  - type: web
    name: erp-gestion
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py crear_grupos_permisos && python manage.py crear_admin_inicial && python manage.py axes_reset"
    startCommand: "gunicorn erp.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
