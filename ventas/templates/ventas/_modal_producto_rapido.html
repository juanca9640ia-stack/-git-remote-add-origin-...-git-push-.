<div class="modal fade" id="modalProductoRapido" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nuevo producto o servicio</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="producto-rapido-error" class="alert alert-danger d-none"></div>
                <div class="mb-2">
                    <label class="form-label small">Tipo</label>
                    <select class="form-control" id="pr-tipo">
                        <option value="producto" selected>Producto</option>
                        <option value="servicio">Servicio</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Nombre *</label>
                    <input type="text" class="form-control" id="pr-nombre">
                </div>
                <div class="mb-2">
                    <label class="form-label small">SKU</label>
                    <input type="text" class="form-control" id="pr-sku" placeholder="Se genera automático si se deja en blanco">
                </div>
                <div class="mb-2">
                    <label class="form-label small">Descripción</label>
                    <textarea class="form-control" id="pr-descripcion" rows="2"></textarea>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label small">Precio de venta *</label>
                        <input type="number" step="0.01" class="form-control" id="pr-precio-venta">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Precio de costo</label>
                        <input type="number" step="0.01" class="form-control" id="pr-precio-costo">
                    </div>
                </div>
                <div id="pr-campos-stock" class="row g-2">
                    <div class="col-6">
                        <label class="form-label small">Stock inicial</label>
                        <input type="number" class="form-control" id="pr-stock-actual" value="0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Stock mínimo</label>
                        <input type="number" class="form-control" id="pr-stock-minimo" value="0">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="pr-guardar">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    var modalEl = document.getElementById('modalProductoRapido');
    var modal = new bootstrap.Modal(modalEl);
    var errorBox = document.getElementById('producto-rapido-error');
    var tipoSelect = document.getElementById('pr-tipo');
    var camposStock = document.getElementById('pr-campos-stock');

    function actualizarCamposStock() {
        camposStock.style.display = tipoSelect.value === 'servicio' ? 'none' : '';
    }
    tipoSelect.addEventListener('change', actualizarCamposStock);

    document.getElementById('abrir-modal-producto')?.addEventListener('click', function () {
        errorBox.classList.add('d-none');
        errorBox.textContent = '';
        ['pr-nombre', 'pr-sku', 'pr-descripcion', 'pr-precio-venta', 'pr-precio-costo'].forEach(function (id) {
            document.getElementById(id).value = '';
        });
        document.getElementById('pr-stock-actual').value = '0';
        document.getElementById('pr-stock-minimo').value = '0';
        tipoSelect.value = 'producto';
        actualizarCamposStock();
        modal.show();
    });

    document.getElementById('pr-guardar').addEventListener('click', function () {
        var csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        var data = new URLSearchParams({
            nombre: document.getElementById('pr-nombre').value,
            sku: document.getElementById('pr-sku').value,
            descripcion: document.getElementById('pr-descripcion').value,
            tipo: tipoSelect.value,
            precio_venta: document.getElementById('pr-precio-venta').value,
            precio_costo: document.getElementById('pr-precio-costo').value,
            stock_actual: document.getElementById('pr-stock-actual').value || '0',
            stock_minimo: document.getElementById('pr-stock-minimo').value || '0',
        });
        fetch("{% url 'inventario:producto_crear_rapido' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: data,
        })
            .then(function (resp) { return resp.json(); })
            .then(function (json) {
                if (json.ok) {
                    preciosProducto[json.id] = json.{{ campo_precio|default:"precio_venta" }};
                    descripcionesProducto[json.id] = json.descripcion;
                    document.querySelectorAll('select[name$="-producto"]').forEach(function (select) {
                        var option = document.createElement('option');
                        option.value = json.id;
                        option.textContent = json.nombre;
                        select.appendChild(option.cloneNode(true));
                    });
                    var emptyFormSelect = document.querySelector('#empty-form select[name$="-producto"]');
                    if (emptyFormSelect) {
                        var opt = document.createElement('option');
                        opt.value = json.id;
                        opt.textContent = json.nombre;
                        emptyFormSelect.appendChild(opt);
                    }
                    modal.hide();
                } else {
                    var mensajes = [];
                    Object.keys(json.errors).forEach(function (campo) {
                        json.errors[campo].forEach(function (err) { mensajes.push(err.message || err); });
                    });
                    errorBox.textContent = mensajes.join(' ');
                    errorBox.classList.remove('d-none');
                }
            });
    });
});
</script>
